<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CarbonOracle · Depth Node</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #39ff14;
    --amber: #ffb300;
    --red: #ff3333;
    --bg: #000;
    --panel: rgba(0,0,0,0.82);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #000;
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
    width: 100vw; height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  /* FULLSCREEN DEPTH CANVAS */
  #depthCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100dvh;
    object-fit: cover;
    image-rendering: pixelated;
    z-index: 0;
  }
  #hiddenVideo {
    position: fixed;
    opacity: 0; pointer-events: none;
    top: -9999px;
    width: 320px; height: 240px;
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 3px,
      rgba(0,0,0,0.18) 3px,
      rgba(0,0,0,0.18) 4px
    );
  }

  /* Vignette */
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%);
  }

  /* TOP BAR */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 10px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
  }
  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 900;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 12px var(--green);
  }
  .logo span { color: #fff; font-weight: 400; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #333; display: inline-block; margin-right: 6px;
    transition: all 0.3s;
  }
  .status-dot.live { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 1.2s infinite; }
  .status-dot.loading { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink 0.5s infinite; }
  .status-dot.error { background: var(--red); box-shadow: 0 0 8px var(--red); }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-size: 0.6rem; letter-spacing: 3px; color: #aaa; }

  /* HUD CORNER PANELS */
  .hud-panel {
    position: fixed; z-index: 10;
    background: var(--panel);
    border: 1px solid rgba(57,255,20,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
  }
  .hud-tl { top: 64px; left: 12px; min-width: 140px; }
  .hud-tr { top: 64px; right: 12px; min-width: 130px; }
  .hud-bl { bottom: 90px; left: 12px; min-width: 140px; }
  .hud-br { bottom: 90px; right: 12px; min-width: 110px; }

  .hud-label { font-size: 0.48rem; letter-spacing: 3px; color: #555; margin-bottom: 7px; }
  .hud-row { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 4px; align-items: baseline; }
  .hud-key { font-size: 0.55rem; color: #666; }
  .hud-val { font-size: 0.72rem; color: var(--green); font-weight: bold; }
  .hud-val.amber { color: var(--amber); }
  .hud-val.white { color: #fff; }
  .hud-val.dim { color: #444; }

  /* DEPTH LEGEND */
  .depth-legend {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel);
    border: 1px solid rgba(57,255,20,0.15);
    border-radius: 20px;
    padding: 6px 14px;
    backdrop-filter: blur(6px);
  }
  .legend-bar {
    width: 80px; height: 8px; border-radius: 4px;
    background: linear-gradient(to right, #000, #fff);
    border: 1px solid #333;
  }
  .legend-text { font-size: 0.5rem; letter-spacing: 2px; color: #555; }

  /* BOTTOM BAR */
  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 10;
    display: flex; gap: 10px; align-items: center; justify-content: center;
    padding: 12px 16px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.92), transparent);
  }
  .btn-start {
    flex: 1; max-width: 260px;
    padding: 14px 10px;
    background: var(--green);
    color: #000;
    border: none; border-radius: 10px;
    font-family: 'Orbitron', monospace;
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 3px; cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(57,255,20,0.4);
    transition: all 0.2s;
  }
  .btn-start:disabled {
    background: #1a1a1a; color: #333;
    box-shadow: none; cursor: not-allowed;
  }
  .btn-mode {
    padding: 14px 16px;
    background: transparent;
    border: 1px solid rgba(57,255,20,0.3);
    border-radius: 10px;
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem; letter-spacing: 2px;
    cursor: pointer;
  }

  /* CROSSHAIR */
  .crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 9; pointer-events: none;
    width: 40px; height: 40px;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(57,255,20,0.5);
  }
  .crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
  .crosshair::after { width: 100%; height: 1px; top: 50%; left: 0; }

  /* CENTER DEPTH READOUT */
  .center-depth {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, 30px);
    z-index: 10; text-align: center;
    pointer-events: none;
  }
  .center-depth-val {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem; font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(57,255,20,0.4);
    letter-spacing: 2px;
  }
  .center-depth-label { font-size: 0.45rem; letter-spacing: 4px; color: #666; margin-top: 2px; }

  /* PACKETS COUNTER */
  .pkt-counter {
    font-size: 0.5rem; letter-spacing: 2px; color: #333;
    text-align: center; padding-bottom: 2px;
  }

  /* LOADING SCREEN */
  #loadScreen {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
  }
  .load-logo {
    font-family: 'Orbitron', monospace;
    font-size: 1.4rem; font-weight: 900;
    letter-spacing: 6px;
    color: var(--green);
    text-shadow: 0 0 30px var(--green);
  }
  .load-sub { font-size: 0.6rem; letter-spacing: 4px; color: #555; }
  .load-bar-wrap { width: 200px; height: 2px; background: #111; border-radius: 2px; overflow: hidden; }
  .load-bar { height: 100%; width: 0%; background: var(--green); transition: width 0.4s; box-shadow: 0 0 8px var(--green); }
  .load-msg { font-size: 0.6rem; letter-spacing: 2px; color: #555; min-height: 16px; }

  /* FPS */
  .fps { font-size: 0.48rem; letter-spacing: 2px; color: #333; }
</style>
</head>
<body>

<!-- HIDDEN VIDEO for depth processing -->
<video id="hiddenVideo" autoplay playsinline muted></video>

<!-- FULLSCREEN DEPTH MAP -->
<canvas id="depthCanvas"></canvas>

<!-- Overlays -->
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- LOADING SCREEN -->
<div id="loadScreen">
  <div class="load-logo">CARBONORACLE</div>
  <div class="load-sub">DEPTH MAPPING NODE v2.0</div>
  <div class="load-bar-wrap"><div class="load-bar" id="loadBar"></div></div>
  <div class="load-msg" id="loadMsg">INITIALIZING...</div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">C<span>arbon</span>O<span>racle</span></div>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">IDLE</span>
  </div>
</div>

<!-- CROSSHAIR -->
<div class="crosshair"></div>

<!-- CENTER DEPTH -->

  <div class="center-depth-val" id="centerDepth">--</div>
  <div class="center-depth-label">CENTER DEPTH</div>
</div>

<!-- HUD: GPS -->
<div class="hud-panel hud-tl">
  <div class="hud-label">📍 GPS</div>
  <div class="hud-row"><span class="hud-key">LAT</span><span class="hud-val" id="lat">--</span></div>
  <div class="hud-row"><span class="hud-key">LNG</span><span class="hud-val" id="lng">--</span></div>
  <div class="hud-row"><span class="hud-key">ALT</span><span class="hud-val amber" id="alt">--</span></div>
  <div class="hud-row"><span class="hud-key">ACC</span><span class="hud-val white" id="acc">--</span></div>
</div>

<!-- HUD: IMU -->
<div class="hud-panel hud-tr">
  <div class="hud-label">📐 IMU</div>
  <div class="hud-row"><span class="hud-key">AX</span><span class="hud-val" id="ax">--</span></div>
  <div class="hud-row"><span class="hud-key">AY</span><span class="hud-val" id="ay">--</span></div>
  <div class="hud-row"><span class="hud-key">AZ</span><span class="hud-val amber" id="az">--</span></div>
  <div class="hud-row"><span class="hud-key">GY</span><span class="hud-val" id="gy">--</span></div>
</div>

<!-- HUD: DEPTH STATS -->
<div class="hud-panel hud-bl">
  <div class="hud-label">🌊 DEPTH MAP</div>
  <div class="hud-row"><span class="hud-key">MIN</span><span class="hud-val white" id="dMin">--</span></div>
  <div class="hud-row"><span class="hud-key">MAX</span><span class="hud-val dim" id="dMax">--</span></div>
  <div class="hud-row"><span class="hud-key">AVG</span><span class="hud-val" id="dAvg">--</span></div>
  <div class="fps" id="fps">-- FPS</div>
</div>

<!-- HUD: PACKETS -->
<div class="hud-panel hud-br">
  <div class="hud-label">📡 UPLINK</div>
  <div class="hud-row"><span class="hud-key">PKTS</span><span class="hud-val" id="pkts">0</span></div>
  <div class="hud-row"><span class="hud-key">SIZE</span><span class="hud-val amber" id="pktSize">--</span></div>
</div>

<!-- DEPTH LEGEND -->
<div class="depth-legend">
  <span class="legend-text">NEAR</span>
  <div class="legend-bar"></div>
  <span class="legend-text">FAR</span>
</div>

<!-- BOTTOM BAR -->
<div class="bottombar">
  <button class="btn-mode" id="colorBtn" onclick="toggleColorMode()">🎨</button>
  <button class="btn-start" id="startBtn" onclick="startAll()">⬡ ACTIVATE DEPTH SCAN</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzEV5MY4_pT5ZEbUTVLCLN3HnC1myHRMo",
  authDomain: "rover-107c5.firebaseapp.com",
  databaseURL: "https://rover-107c5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "rover-107c5",
  storageBucket: "rover-107c5.firebasestorage.app",
  messagingSenderId: "498191140744",
  appId: "1:498191140744:web:8bcf47ebab898006165c3d"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ── STATE ──────────────────────────────────────────────────
let depthModel = null;
let colorMode = 0; // 0=greyscale 1=heatmap 2=inferno
let packets = 0;
let lastFrameTime = performance.now();
let frameCount = 0;
let running = false;

let sensorData = {
  gps: { lat: 0, lng: 0, alt: 0, acc: 0 },
  accel: { x: 0, y: 0, z: 0 },
  gyro: { alpha: 0, beta: 0, gamma: 0 },
  depth: { min: 0, max: 0, avg: 0, centerVal: 0, imageB64: '' }
};

// ── LOAD SCREEN ────────────────────────────────────────────
function loadProgress(pct, msg) {
  document.getElementById('loadBar').style.width = pct + '%';
  document.getElementById('loadMsg').textContent = msg;
}

// ── START ──────────────────────────────────────────────────
window.startAll = async function() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;

  // Show load screen
  document.getElementById('loadScreen').style.display = 'flex';
  setStatus('loading', 'LOADING');

  loadProgress(10, 'LOADING TENSORFLOW.JS...');
  await tf.ready();

  loadProgress(25, 'DOWNLOADING DEPTH MODEL...');
  // Load MiDaS small via TF Hub (runs on mobile)
  try {
    depthModel = await tf.loadGraphModel(
      'https://tfhub.dev/intel/lite-model/midas/v2_1_small/1/lite/1',
      { fromTFHub: true }
    );
  } catch(e) {
    // Fallback: use a simple edge-based pseudo-depth if model fails
    depthModel = null;
    console.warn('MiDaS load failed, using fallback depth:', e);
  }

  loadProgress(55, 'STARTING CAMERA...');
  // Camera
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 320 }, height: { ideal: 240 } }
    });
    const video = document.getElementById('hiddenVideo');
    video.srcObject = stream;
    await video.play();
  } catch(e) {
    loadProgress(100, '✕ CAMERA FAILED: ' + e.message);
    setStatus('error', 'CAM ERR');
    btn.disabled = false;
    setTimeout(() => document.getElementById('loadScreen').style.display = 'none', 3000);
    return;
  }

  loadProgress(70, 'REQUESTING PERMISSIONS...');
  // Motion permission (iOS)
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
  }

  // GPS
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(pos => {
      const c = pos.coords;
      const alt = c.altitude ?? 0;
      sensorData.gps = { lat: c.latitude, lng: c.longitude, alt, acc: c.accuracy };
      document.getElementById('lat').textContent = c.latitude.toFixed(5);
      document.getElementById('lng').textContent = c.longitude.toFixed(5);
      document.getElementById('alt').textContent = alt.toFixed(1) + 'm';
      document.getElementById('acc').textContent = '±' + c.accuracy.toFixed(0) + 'm';
    }, null, { enableHighAccuracy: true });
  }

  // Accelerometer
  window.addEventListener('devicemotion', e => {
    const a = e.accelerationIncludingGravity;
    if (!a) return;
    sensorData.accel = { x: +a.x?.toFixed(2)||0, y: +a.y?.toFixed(2)||0, z: +a.z?.toFixed(2)||0 };
    document.getElementById('ax').textContent = sensorData.accel.x;
    document.getElementById('ay').textContent = sensorData.accel.y;
    document.getElementById('az').textContent = sensorData.accel.z;
  });

  // Gyro
  window.addEventListener('deviceorientation', e => {
    sensorData.gyro = { alpha: +e.alpha?.toFixed(1)||0, beta: +e.beta?.toFixed(1)||0, gamma: +e.gamma?.toFixed(1)||0 };
    document.getElementById('gy').textContent = sensorData.gyro.beta?.toFixed(1);
  });

  loadProgress(90, 'WARMING UP DEPTH ENGINE...');
  await new Promise(r => setTimeout(r, 500));
  loadProgress(100, 'READY');
  await new Promise(r => setTimeout(r, 400));

  // Hide load screen
  document.getElementById('loadScreen').style.display = 'none';
  running = true;
  setStatus('live', 'LIVE');

  // Start depth loop
  requestAnimationFrame(depthLoop);

  // Firebase push every 1000ms (depth image is large)
  setInterval(pushFirebase, 1000);
};

// ── DEPTH LOOP ─────────────────────────────────────────────
const depthCanvas = document.getElementById('depthCanvas');
const dCtx = depthCanvas.getContext('2d', { willReadFrequently: true });

// Off-screen canvas for video frame
const offCanvas = document.createElement('canvas');
offCanvas.width = 256; offCanvas.height = 256;
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

async function depthLoop() {
  if (!running) return;

  const video = document.getElementById('hiddenVideo');
  if (video.readyState < 2) { requestAnimationFrame(depthLoop); return; }

  // FPS
  frameCount++;
  const now = performance.now();
  const elapsed = now - lastFrameTime;
  if (elapsed > 1000) {
    document.getElementById('fps').textContent = Math.round(frameCount * 1000 / elapsed) + ' FPS';
    frameCount = 0; lastFrameTime = now;
  }

  // Match canvas to screen
  depthCanvas.width = window.innerWidth;
  depthCanvas.height = window.innerHeight;

  let depthMap; // Float32Array of [0..1] values, 256x256

  if (depthModel) {
    depthMap = await runMiDaS(video);
  } else {
    depthMap = fallbackDepth(video);
  }

  // Render depth map fullscreen
  renderDepth(depthMap, 256, 256);

  requestAnimationFrame(depthLoop);
}

// ── MiDaS INFERENCE ───────────────────────────────────────
async function runMiDaS(video) {
  let depthMap;
  try {
    const inputTensor = tf.tidy(() => {
      const img = tf.browser.fromPixels(video);
      const resized = tf.image.resizeBilinear(img, [256, 256]);
      const normalized = resized.toFloat().div(255.0);
      return normalized.expandDims(0); // [1, 256, 256, 3]
    });

    const output = depthModel.predict(inputTensor);
    const rawData = await output.squeeze().data();
    inputTensor.dispose();
    output.dispose();

    // Normalize to [0,1]
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < rawData.length; i++) {
      if (rawData[i] < min) min = rawData[i];
      if (rawData[i] > max) max = rawData[i];
    }
    const range = max - min || 1;
    depthMap = new Float32Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) {
      depthMap[i] = (rawData[i] - min) / range;
    }

    // Update stats
    const avg = rawData.reduce((s, v) => s + v, 0) / rawData.length;
    const centerIdx = Math.floor(128 * 256 + 128);
    const centerVal = depthMap[centerIdx];
    updateDepthStats(min, max, avg, centerVal);

  } catch(e) {
    depthMap = fallbackDepth(video);
  }
  return depthMap;
}

// ── FALLBACK: LUMINANCE-BASED PSEUDO DEPTH ─────────────────
// If MiDaS fails, use luminance + edge-based heuristic
// Bright = closer (works for foliage/sky differentiation)
function fallbackDepth(video) {
  offCtx.drawImage(video, 0, 0, 256, 256);
  const imgData = offCtx.getImageData(0, 0, 256, 256);
  const d = imgData.data;
  const depth = new Float32Array(256 * 256);

  for (let i = 0; i < 256 * 256; i++) {
    const r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    // Luminance
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    // Green objects are likely trees/near objects
    const greenBias = Math.max(0, (g - r - 20) / 255);
    depth[i] = Math.min(1, lum * 0.7 + greenBias * 0.3);
  }

  // Simple Gaussian blur pass to smooth
  const smoothed = gaussianBlur(depth, 256, 256, 2);

  const min = Math.min(...smoothed);
  const max = Math.max(...smoothed);
  const avg = smoothed.reduce((a,b)=>a+b,0)/smoothed.length;
  updateDepthStats(min, max, avg, smoothed[128*256+128]);

  return smoothed;
}

function gaussianBlur(data, w, h, radius) {
  const out = new Float32Array(data.length);
  const kernelSize = radius * 2 + 1;
  // Horizontal pass
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0, count = 0;
      for (let k = -radius; k <= radius; k++) {
        const nx = Math.max(0, Math.min(w-1, x+k));
        sum += data[y*w+nx]; count++;
      }
      out[y*w+x] = sum/count;
    }
  }
  // Vertical pass
  const out2 = new Float32Array(data.length);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0, count = 0;
      for (let k = -radius; k <= radius; k++) {
        const ny = Math.max(0, Math.min(h-1, y+k));
        sum += out[ny*w+x]; count++;
      }
      out2[y*w+x] = sum/count;
    }
  }
  return out2;
}

// ── RENDER DEPTH MAP ──────────────────────────────────────
function renderDepth(depthMap, srcW, srcH) {
  const W = depthCanvas.width, H = depthCanvas.height;
  const imgData = dCtx.createImageData(srcW, srcH);
  const d = imgData.data;

  for (let i = 0; i < srcW * srcH; i++) {
    const v = depthMap[i]; // 0=far, 1=near (invert for natural look: bright=near)
    const inv = 1 - v; // invert: close=bright

    let r, g, b;
    if (colorMode === 0) {
      // Pure greyscale
      const c = Math.round(inv * 255);
      r = g = b = c;
    } else if (colorMode === 1) {
      // Heatmap: black → blue → cyan → green → yellow → red → white
      [r, g, b] = heatmap(inv);
    } else {
      // Inferno: black → purple → orange → yellow
      [r, g, b] = inferno(inv);
    }

    d[i*4]   = r;
    d[i*4+1] = g;
    d[i*4+2] = b;
    d[i*4+3] = 255;
  }

  // Draw low-res to offscreen then scale up
  const tmpCanvas = document.createElement('canvas');
  tmpCanvas.width = srcW; tmpCanvas.height = srcH;
  tmpCanvas.getContext('2d').putImageData(imgData, 0, 0);

  // Scale to fill screen with slight smoothing
  dCtx.imageSmoothingEnabled = true;
  dCtx.imageSmoothingQuality = 'medium';
  dCtx.drawImage(tmpCanvas, 0, 0, W, H);

  // Store compressed snapshot for Firebase
  sensorData.depth.imageB64 = tmpCanvas.toDataURL('image/jpeg', 0.25).split(',')[1];
}

function heatmap(t) {
  const stops = [[0,0,0],[0,0,255],[0,255,255],[0,255,0],[255,255,0],[255,0,0],[255,255,255]];
  const s = t * (stops.length - 1);
  const i = Math.floor(s), f = s - i;
  const a = stops[Math.min(i, stops.length-1)];
  const b2 = stops[Math.min(i+1, stops.length-1)];
  return [Math.round(a[0]+(b2[0]-a[0])*f), Math.round(a[1]+(b2[1]-a[1])*f), Math.round(a[2]+(b2[2]-a[2])*f)];
}

function inferno(t) {
  const stops = [[0,0,4],[40,11,84],[101,21,110],[159,42,99],[212,72,66],[245,125,21],[252,194,14],[252,255,164]];
  const s = t * (stops.length - 1);
  const i = Math.floor(s), f = s - i;
  const a = stops[Math.min(i, stops.length-1)];
  const b2 = stops[Math.min(i+1, stops.length-1)];
  return [Math.round(a[0]+(b2[0]-a[0])*f), Math.round(a[1]+(b2[1]-a[1])*f), Math.round(a[2]+(b2[2]-a[2])*f)];
}

// ── DEPTH STATS UI ─────────────────────────────────────────
function updateDepthStats(min, max, avg, center) {
  sensorData.depth.min = +min.toFixed(3);
  sensorData.depth.max = +max.toFixed(3);
  sensorData.depth.avg = +avg.toFixed(3);
  sensorData.depth.centerVal = +center.toFixed(3);

  document.getElementById('dMin').textContent = min.toFixed(3);
  document.getElementById('dMax').textContent = max.toFixed(3);
  document.getElementById('dAvg').textContent = avg.toFixed(3);

  // Center depth as percentage (100% = closest)
  const pct = Math.round((1 - center) * 100);
  document.getElementById('centerDepth').textContent = pct + '%';
}

// ── FIREBASE ───────────────────────────────────────────────
async function pushFirebase() {
  if (!running) return;
  try {
    const payload = {
      gps: sensorData.gps,
      accel: sensorData.accel,
      gyro: sensorData.gyro,
      depthStats: {
        min: sensorData.depth.min,
        max: sensorData.depth.max,
        avg: sensorData.depth.avg,
        centerVal: sensorData.depth.centerVal
      },
      depthImageB64: sensorData.depth.imageB64,
      timestamp: Date.now()
    };
    await set(ref(db, 'rover/phone'), payload);
    packets++;
    document.getElementById('pkts').textContent = packets;
    // Estimate packet size
    const kb = Math.round(JSON.stringify(payload).length / 1024);
    document.getElementById('pktSize').textContent = kb + ' KB';
  } catch(e) {
    console.error('Firebase push failed:', e);
  }
}

// ── COLOR MODE TOGGLE ──────────────────────────────────────
window.toggleColorMode = function() {
  colorMode = (colorMode + 1) % 3;
  const labels = ['⬜ GREY', '🌈 HEAT', '🔥 INFERNO'];
  document.getElementById('colorBtn').textContent = labels[colorMode];
};

// ── STATUS ─────────────────────────────────────────────────
function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
}

// Hide load screen on first interaction if not started
document.getElementById('startBtn').addEventListener('click', () => {}, { once: true });
</script>
